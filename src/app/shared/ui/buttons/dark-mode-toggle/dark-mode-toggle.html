<button 
  type="button"
  class="toggle"
  [class.toggle--active]="theme.isDark()"
  (click)="toggle()"
  role="switch"
  [attr.aria-checked]="theme.isDark()"
  [attr.aria-label]="theme.isDark() ? messages.darkModeToggle.aria.disable : messages.darkModeToggle.aria.enable"
>
  <div class="toggle__thumb">
    <i 
      class="pi toggle__icon-inner"
      [ngClass]="theme.isDark() ? 'pi-moon' : 'pi-sun'"
      aria-hidden="true"
    ></i>
  </div>
</button>
